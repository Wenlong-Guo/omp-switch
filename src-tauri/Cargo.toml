[package]
name = "omp-switch"
version = "0.1.0"
description = "oh-my-pi 配置管理器"
authors = ["Wenlong-Guo"]
license = "MIT"
repository = "https://github.com/Wenlong-Guo/omp-switch"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.34", features = ["bundled", "chrono"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
notify = "8"
tempfile = "3"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
mockall = "0.13"

[lib]
name = "omp_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
